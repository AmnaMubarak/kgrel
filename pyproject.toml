[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kgrel"
version = "0.1.0"
description = "Reliability-aware dynamic ontology evolution for LLM-based knowledge-graph construction."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Amna Mubarak", email = "amnamubarakk111@gmail.com" }
]
keywords = [
    "knowledge-graph",
    "large-language-models",
    "hallucination",
    "reliability",
    "information-extraction",
    "ontology-evolution",
    "text2kgbench"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "requests>=2.28",
    "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1"
]

[project.urls]
Homepage = "https://github.com/AmnaMubarak/kgrel"
Issues   = "https://github.com/AmnaMubarak/kgrel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kgrel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
